# Local development services only (Postgres + Redis on localhost); run apps with `pnpm dev`.
#   pnpm env:setup                                    # once: creates .env with generated secrets
#   docker compose -f docker-compose.dev.yml up -d
#   docker compose -f docker-compose.dev.yml down     # add -v to wipe data
name: repopulse-dev

services:
  postgres:
    image: postgres:19-alpine3.24
    restart: unless-stopped
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=top
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - jit=off
      - -c
      - wal_compression=zstd
      - -c
      - idle_in_transaction_session_timeout=60s
      - -c
      - idle_session_timeout=10min
      - -c
      - log_min_duration_statement=500
      - -c
      - log_lock_waits=on
      - -c
      - log_temp_files=0
    shm_size: 256m
    stop_grace_period: 30s
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-repopulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run `pnpm env:setup` to create .env}
      POSTGRES_DB: ${POSTGRES_DB:-repopulse}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-repopulse} -d ${POSTGRES_DB:-repopulse}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    # Same as production: noeviction is required for BullMQ.
    command: redis-server --appendonly yes --maxmemory-policy noeviction --requirepass ${REDIS_PASSWORD:?run `pnpm env:setup` to create .env}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
