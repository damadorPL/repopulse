# Local development services only (Postgres + Redis on localhost); run apps with `pnpm dev`.
#   pnpm env:setup                                    # once: creates .env with generated secrets
#   docker compose -f docker-compose.dev.yml up -d
#   docker compose -f docker-compose.dev.yml down     # add -v to wipe data
name: repopulse-dev

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-repopulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run `pnpm env:setup` to create .env}
      POSTGRES_DB: ${POSTGRES_DB:-repopulse}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-repopulse} -d ${POSTGRES_DB:-repopulse}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Same as production: noeviction is required for BullMQ.
    command: redis-server --appendonly yes --maxmemory-policy noeviction --requirepass ${REDIS_PASSWORD:?run `pnpm env:setup` to create .env}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
