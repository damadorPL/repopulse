packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  # Optional native msgpack accelerator pulled in by bullmq; its pure-JS fallback is used.
  msgpackr-extract: false
  prisma: true
minimumReleaseAgeExclude:
  - '@next/env@16.4.4'
  - '@next/swc-darwin-arm64@16.4.4'
  - '@next/swc-darwin-x64@16.4.4'
  - '@next/swc-linux-arm64-gnu@16.4.4'
  - '@next/swc-linux-arm64-musl@16.4.4'
  - '@next/swc-linux-x64-gnu@16.4.4'
  - '@next/swc-linux-x64-musl@16.4.4'
  - '@next/swc-win32-arm64-msvc@16.4.4'
  - '@next/swc-win32-x64-msvc@16.4.4'
  - '@vitest/mocker@5.1.0'
  - '@vitest/spy@5.1.0'
  - next@16.4.4
  - semver@7.8.6
  - vitest@5.1.0
overrides:
  # @tailwindcss/typography 0.5.20 pins 6.0.10, which is affected by GHSA-rj75-hqrm-r3gf (fixed in 6.1.5).
  postcss-selector-parser: 6.1.5
