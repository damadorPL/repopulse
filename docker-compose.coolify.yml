# RepoPulse production stack for Coolify (Docker Compose build pack).
# Deploys web + worker + one-off migrator + PostgreSQL + Redis atomically from this repo, plus the
# Dependencies module (Slice 08): deps-worker, the deps-sandbox lockfile runner and its deps-egress
# allowlist proxy. deps-sandbox sits on the internal deps_sandbox network, whose only way out is deps-egress.
# Local test: cp .env.example .env && docker compose -f docker-compose.coolify.yml up --build

x-database-url: &database-url postgresql://${POSTGRES_USER:-repopulse}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-repopulse}
x-redis-url: &redis-url redis://:${REDIS_PASSWORD}@redis:6379

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-repopulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-repopulse}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-repopulse} -d ${POSTGRES_DB:-repopulse}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # CRITICAL: maxmemory-policy noeviction is required for BullMQ stability
    command: redis-server --appendonly yes --maxmemory-policy noeviction --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrator:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
      target: migrator
    environment:
      DATABASE_URL: *database-url
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: *database-url
      REDIS_URL: *redis-url
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_GITHUB_ID: ${AUTH_GITHUB_ID}
      AUTH_GITHUB_SECRET: ${AUTH_GITHUB_SECRET}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY}
      # Release history defaults (must match the worker). The admin panel shows them and can override each one.
      RELEASE_BACKFILL_DEFAULT_TARGET: ${RELEASE_BACKFILL_DEFAULT_TARGET:-100}
      RELEASE_BACKFILL_MAX_AGE_DAYS: ${RELEASE_BACKFILL_MAX_AGE_DAYS:-365}
      RELEASE_BACKFILL_HARD_CAP: ${RELEASE_BACKFILL_HARD_CAP:-1000}
      RELEASE_BACKFILL_MIN_QUOTA: ${RELEASE_BACKFILL_MIN_QUOTA:-500}
      # "Send Test" in Settings → Notifications delivers from the web container (same value as the worker).
      # SMTP is not an env setting: the super admin sets it up in Settings → Email (stored encrypted in Postgres).
      ALLOW_INTERNAL_WEBHOOK_HOSTS: ${ALLOW_INTERNAL_WEBHOOK_HOSTS:-}
      APP_BASE_URL: ${SERVICE_URL_WEB}
      # Coolify injects SERVICE_URL_WEB (scheme included; SERVICE_FQDN_WEB is a bare host)
      NEXTAUTH_URL: ${SERVICE_URL_WEB}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
      target: runner
    restart: unless-stopped
    # Give in-flight jobs time to finish on Coolify rollouts (SIGTERM -> graceful close).
    stop_grace_period: 30s
    environment:
      NODE_ENV: production
      DATABASE_URL: *database-url
      REDIS_URL: *redis-url
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY}
      POLL_INTERVAL_CRON: ${POLL_INTERVAL_CRON:-*/30 * * * *}
      REPO_POLL_CONCURRENCY: ${REPO_POLL_CONCURRENCY:-5}
      NOTIFICATION_CONCURRENCY: ${NOTIFICATION_CONCURRENCY:-10}
      RELEASE_BACKFILL_DEFAULT_TARGET: ${RELEASE_BACKFILL_DEFAULT_TARGET:-100}
      RELEASE_BACKFILL_MAX_AGE_DAYS: ${RELEASE_BACKFILL_MAX_AGE_DAYS:-365}
      RELEASE_BACKFILL_HARD_CAP: ${RELEASE_BACKFILL_HARD_CAP:-1000}
      RELEASE_BACKFILL_MIN_QUOTA: ${RELEASE_BACKFILL_MIN_QUOTA:-500}
      # Webhooks to private networks are blocked unless allowed here (true, or a host list).
      ALLOW_INTERNAL_WEBHOOK_HOSTS: ${ALLOW_INTERNAL_WEBHOOK_HOSTS:-}
      APP_BASE_URL: ${SERVICE_URL_WEB}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  deps-worker:
    build:
      context: .
      dockerfile: apps/deps-worker/Dockerfile
      target: runner
    restart: unless-stopped
    # Give in-flight scans and update PRs time to finish on Coolify rollouts (SIGTERM -> graceful close).
    stop_grace_period: 30s
    environment:
      NODE_ENV: production
      DATABASE_URL: *database-url
      REDIS_URL: *redis-url
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY}
      ALLOW_INTERNAL_WEBHOOK_HOSTS: ${ALLOW_INTERNAL_WEBHOOK_HOSTS:-}
      APP_BASE_URL: ${SERVICE_URL_WEB}
      # Lockfile regeneration for update PRs. The token must be the one deps-sandbox gets.
      DEPS_SANDBOX_URL: ${DEPS_SANDBOX_URL:-http://deps-sandbox:3003}
      DEPS_SANDBOX_TOKEN: ${DEPS_SANDBOX_TOKEN}
      DEPS_SCAN_CRON: ${DEPS_SCAN_CRON:-17 * * * *}
      DEPS_SCAN_CONCURRENCY: ${DEPS_SCAN_CONCURRENCY:-3}
      DEPS_UPDATE_CONCURRENCY: ${DEPS_UPDATE_CONCURRENCY:-1}
      DEPS_HEALTH_PORT: ${DEPS_HEALTH_PORT:-3002}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    # default: Postgres, Redis, GitHub and the registries. deps_sandbox: calls to deps-sandbox.
    networks:
      - default
      - deps_sandbox
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${DEPS_HEALTH_PORT:-3002}/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Runs npm / pnpm / Bun / uv / Poetry on untrusted manifests to regenerate lockfiles. It holds no secret besides
  # its own bearer token: no database, no Redis, no volumes, no env_file. Internal network only; the registries
  # are reached through deps-egress.
  deps-sandbox:
    build:
      context: .
      dockerfile: apps/deps-sandbox/Dockerfile
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      # Required, at least 16 characters (`pnpm env:setup` generates one). Same value as deps-worker's.
      DEPS_SANDBOX_TOKEN: ${DEPS_SANDBOX_TOKEN}
      DEPS_SANDBOX_TIMEOUT_MS: ${DEPS_SANDBOX_TIMEOUT_MS:-300000}
    networks:
      - deps_sandbox
    read_only: true
    tmpfs:
      - /tmp:size=2g
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: 2g
    cpus: 2
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3003/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Allowlist forward proxy, the sandbox's only way out: HTTPS CONNECT to the npm and PyPI registries only.
  deps-egress:
    # Pinned ubuntu/squid image with squid.conf baked in (no bind mount: Coolify does not keep repository files on
    # the host, so a file mount would get an empty directory as its source).
    build:
      context: ./deploy/deps-egress
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      default:
      deps_sandbox:
        aliases:
          - deps-egress

networks:
  # No route to the outside: deps-sandbox reaches only deps-worker (its caller) and deps-egress (the proxy).
  # Services without a `networks:` key stay on the implicit default network, as before.
  deps_sandbox:
    internal: true

volumes:
  postgres_data:
  redis_data:
