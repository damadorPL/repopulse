name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Guardrails, Build, Lint, Doctor & Test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run coding & architectural guardrails
        run: pnpm run check:guardrails

      - name: Lint workspace manifests (Sherif)
        run: pnpm run lint:manifests

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Build workspace packages
        run: pnpm --filter "./packages/*" build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Lint CSS & Tailwind (Stylelint)
        run: pnpm run lint:css

      - name: Check unused files, exports & dependencies (Knip)
        run: pnpm run knip

      - name: Check strict workspace dependency isolation (Knip)
        run: pnpm run knip:strict

      - name: Format check
        run: pnpm format:check

      - name: Docs check
        run: pnpm docs:check

      - name: Run React Doctor
        run: pnpm run doctor

      - name: Test
        env:
          TOKEN_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        run: pnpm test

      - name: Build web app
        run: pnpm --filter @repopulse/web build

      - name: Security audit (high/critical)
        run: pnpm audit --audit-level=high
