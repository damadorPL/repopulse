name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets-and-workflows:
    name: Secrets & Workflow Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks secret scan
        shell: bash
        run: |
          set -euo pipefail
          GITLEAKS_VERSION="8.30.1"
          GITLEAKS_SHA256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          ARCHIVE="${RUNNER_TEMP}/gitleaks.tar.gz"
          curl -fsSLo "${ARCHIVE}" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${ARCHIVE}" | sha256sum --check
          tar -xzf "${ARCHIVE}" -C "${RUNNER_TEMP}" gitleaks
          "${RUNNER_TEMP}/gitleaks" git --no-banner --redact --verbose .

      - name: Lint GitHub Actions workflows (actionlint)
        shell: bash
        run: |
          set -euo pipefail
          ACTIONLINT_VERSION="1.7.12"
          BASE_URL="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          ARCHIVE="${RUNNER_TEMP}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          CHECKSUMS="${RUNNER_TEMP}/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          curl -fsSLo "${ARCHIVE}" "${BASE_URL}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLo "${CHECKSUMS}" "${BASE_URL}/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          (cd "${RUNNER_TEMP}" && sha256sum --ignore-missing --check "${CHECKSUMS}")
          tar -xzf "${ARCHIVE}" -C "${RUNNER_TEMP}" actionlint
          "${RUNNER_TEMP}/actionlint" -color

  ci:
    name: Guardrails, Build, Lint, Doctor & Test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run coding & architectural guardrails
        run: pnpm run check:guardrails

      - name: Lint workspace manifests (Sherif)
        run: pnpm run lint:manifests

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Build workspace packages
        run: pnpm --filter "./packages/*" build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Lint CSS & Tailwind (Stylelint)
        run: pnpm run lint:css

      - name: Check unused files, exports & dependencies (Knip)
        run: pnpm run knip

      - name: Check strict workspace dependency isolation (Knip)
        run: pnpm run knip:strict

      - name: Format check
        run: pnpm format:check

      - name: Docs check
        run: pnpm docs:check

      - name: Run React Doctor
        run: pnpm run doctor

      - name: Test
        env:
          TOKEN_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        run: pnpm test

      - name: Build web app
        run: pnpm --filter @repopulse/web build

      - name: Security audit (high/critical)
        run: pnpm audit --audit-level=high
