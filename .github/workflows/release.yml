name: Release

on:
  push:
    branches:
      - main
    paths:
      - "apps/web/package.json"
      - "CHANGELOG.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26"

      - name: Read version and release notes
        id: meta
        run: node scripts/release-notes.mjs --out "${RUNNER_TEMP}/release-notes.md" --github-output

      - name: Check existing GitHub release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push annotated tag
        if: steps.check.outputs.exists != 'true'
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" "$GITHUB_SHA" -m "Release $VERSION"
            git push origin "refs/tags/$TAG"
          fi

      - name: Create GitHub release
        if: steps.check.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          TITLE: ${{ steps.meta.outputs.title }}
          HAS_NOTES: ${{ steps.meta.outputs.has_notes }}
        run: |
          if [ "$HAS_NOTES" = "true" ]; then
            gh release create "$TAG" --verify-tag --title "$TITLE" --notes-file "${RUNNER_TEMP}/release-notes.md"
          else
            gh release create "$TAG" --verify-tag --title "$TITLE" --generate-notes
          fi
